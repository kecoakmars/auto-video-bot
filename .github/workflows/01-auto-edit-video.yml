name: 01 - Auto Edit Talking Head

on:
  workflow_dispatch:
  # Hapus tanda '#' pada 2 baris di bawah jika ingin berjalan otomatis tiap jam 01.00 WIB:
  # schedule:
  #   - cron: '0 18 * * *'

jobs:
  auto-edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Python & Remotion Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/remotion
            remotion/node_modules
          key: ${{ runner.os }}-v1-${{ hashFiles('engine-ai/requirements.txt', 'remotion/package.json') }}

      - name: Install Python & Remotion Packages
        run: |
          pip install -r engine-ai/requirements.txt
          cd remotion && npm install

      - name: 1. Unduh Video, Potong Jeda & Transkripsi Lokal
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python engine-ai/prep_and_transcribe.py

      - name: 2. Sutradara Gemini Susun Timeline & Pilih B-Roll
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python engine-ai/gemini_director.py

      - name: 3. Bangkitkan Efek Suara Otomatis
        run: python engine-ai/generate_sfx.py

      - name: 4. Render Video Final dengan Remotion
        run: |
          cd remotion
          mkdir -p out
          npx remotion render src/index.ts AutoTalkingHead out/final.mp4 --concurrency=2

      - name: 5. Unggah Hasil ke Google Drive & Arsipkan Bahan
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python engine-ai/finish_upload.py
